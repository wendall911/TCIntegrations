plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    // https://plugins.gradle.org/plugin/me.modmuss50.mod-publish-plugin
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
    // https://plugins.gradle.org/plugin/se.bjurr.gitchangelog.git-changelog-gradle-plugin
    id 'se.bjurr.gitchangelog.git-changelog-gradle-plugin' version '3.0.7'
    id 'io.freefair.lombok' version '8.14.2'
}

repositories {
    maven {
        // location of the maven that hosts Mantle and JEI files
        name = 'Progwml6 maven'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name = 'BlameJared Maven (CrT / Bookshelf / JEI (Newer) / vazkii / xyz)'
        url = 'https://maven.blamejared.com'
    }
    maven { // TOP
        name 'McJty maven'
        url "https://maven.k-4u.nl"
    }
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name 'tterrag maven'
        url 'https://maven.tterrag.com'
    }
    maven {
        name 'LibX maven'
        url = 'https://maven.melanx.de/'
    }
}

group = 'com.github.wendall911.tcintegrations'
def actualVersion = version
version = "${minecraft_version}-${version}"
archivesBaseName = "${mod_name}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '17'

minecraft {
    mappings channel: 'parchment', version: "${mappings_version}-${minecraft_version}"

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file("run").canonicalPath

            mods {
                tcintegrations {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            mods {
                tcintegrations {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            args '--mod', 'tcintegrations',
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing', file('src/generated/resources')

            mods {
                tcintegrations {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("slimeknights.tconstruct:TConstruct:${minecraft_version}-${tic_version}")
    implementation fg.deobf("slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}")

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    runtimeOnly fg.deobf("mcjty.theoneprobe:theoneprobe:${minecraft_short_version}-${probe_version}") {
        transitive = false
    }

    compileOnly fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation fg.deobf("curse.maven:botania-225643:${botania_version}")
    implementation fg.deobf("curse.maven:create-328085:${create_version}")
    implementation fg.deobf("curse.maven:arsnouveau-401955:${arsnouveau_version}")
    implementation fg.deobf("curse.maven:aquaculture-60028:${aquaculture_version}")
    runtimeOnly fg.deobf("curse.maven:geckolib-388172:${geckolib_version}")
    implementation fg.deobf("curse.maven:alexsmobs-426558:${alexsmobs_version}")
    implementation fg.deobf("curse.maven:malum-484064:${malum_version}")
    implementation fg.deobf("curse.maven:lodestone-616457:${lodestone_version}")
    implementation fg.deobf("curse.maven:immersiveengineering-231951:${ie_version}")
    implementation fg.deobf("curse.maven:undergarden-379849:${undergarden_version}")
    implementation fg.deobf("curse.maven:projecte-226410:${projecte_version}")
    implementation fg.deobf("curse.maven:byg-247560:${byg_version}")
    implementation fg.deobf("curse.maven:mekanism-268560:${mekanism_version}")
    runtimeOnly fg.deobf("curse.maven:mekanism_tools-268567:${mekanism_tools_version}")
    runtimeOnly fg.deobf("curse.maven:citadel-331936:${citadel_version}")
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:${patchouli_version}")
    runtimeOnly fg.deobf("curse.maven:curios-309927:${curios_version}")
    runtimeOnly fg.deobf("curse.maven:terrablender-563928:${terrablender_version}")
    runtimeOnly fg.deobf("curse.maven:tinkersurvival-294667:${tinkersurvival_version}")
    implementation fg.deobf("curse.maven:mythicbotany-400058:${mythicbotany_version}")
    runtimeOnly fg.deobf('io.github.noeppi_noeppi.mods:LibX:1.18.2-3.2.18')
    implementation fg.deobf("curse.maven:iceandfire-264231:${iceandfire_version}")
}

def commonManifest = {
    attributes 'FMLAT': 'tcintegrations_at.cfg'
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_name,
            "Specification-Vendor": "${mod_author}",
            "Specification-Version": "${archiveVersion}",
            "Implementation-Title": "${mod_name}",
            "Implementation-Version": "${archiveVersion}",
            "Implementation-Vendor" :"${mod_author}",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
    'version': actualVersion, 'forge_mc_version_range': forge_mc_version_range, 'forge_version_range': forge_version_range,
    'license': license, 'mod_id': mod_id, 'mod_author': mod_author, 'mod_description': mod_description,
    'mod_name': mod_name, 'issue_tracker': issue_tracker, 'mod_credits': mod_credits,
    'mod_update_branch': mod_update_branch, 'malum_minimum_version': malum_minimum_version,
    'create_min_version': create_min_version
]

processResources {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    inputs.properties replaceProperties
    exclude '.cache'
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar.finalizedBy('reobfJar')

def updates = tasks.register("generateUpdates", Copy) {
    it.outputs.upToDateWhen {
        false
    }

    it.from("./files/templates/") {
        include 'updates.json'
        expand 'version': actualVersion, 'minecraft_version': minecraft_version
    }

    it.into 'files/'
}

task changelog(type: se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask) {
    file.set(new File(project(":").projectDir.toString() + '/build/libs/changelog.txt'));
    templateContent.set(file(project(":").projectDir.toString() + '/files/templates/changelog.mustache').getText('UTF-8'));
    toRevision.set('HEAD');
    fromRevision.set("${minecraft_version}-${last_mod_version}");
}

tasks.build.dependsOn('changelog', 'generateUpdates')

def changelogFile = project(":").projectDir.toString() + '/build/libs/changelog.txt'
def publishFile = project(":").projectDir.toString() + "/build/libs/${archivesBaseName}-${version}.jar"

publishMods {
    file = file(publishFile)
    if (file(changelogFile).exists()) {
        changelog = file(changelogFile).text
    }
    type = "${release_type}".startsWith("release") ? STABLE : ("${release_type}".startsWith("beta") ? BETA : ALPHA)
    modLoaders.addAll(['forge'])
    dryRun = providers.environmentVariable('DO_RELEASE').getOrNull() == null

    if (project.hasProperty('ticurseApiKey')) {
        curseforge {
            accessToken = project.ticurseApiKey
            projectId = project.curseforge_id
            projectSlug = curseforge_slug
            javaVersions.add(JavaVersion.toVersion("${java_version}"))
            clientRequired = true
            serverRequired = true
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('mantle')
            requires('tinkers-construct')
            optional('configured')
            optional('catalogue')
            optional('immersive-engineering')
            optional('botania')
            optional('create')
            optional('ars-nouveau')
            optional('tinkersurvival')
            optional('aquaculture')
            optional('alexs-mobs')
            optional('malum')
            optional('the-undergarden')
            optional('projecte')
            optional('beyond-earth')
            optional('oh-the-biomes-youll-go')
            optional('mekanism')
            optional('mythicbotany')
            optional('ice-and-fire-dragons')
        }
    }
    if (project.hasProperty('modrinth_id')) {
        modrinth {
            accessToken = project.modrinthKey
            projectId = project.modrinth_id
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('mantle')
            requires('tinkers-construct')
            optional('immersiveengineering')
            optional('botania')
            optional('create')
            optional('tinkersurvival')
            optional('beyond-earth')
            optional('biomesyougo')
            optional('mekanism')
            optional('mythicbotany')
        }
    }
    if (project.hasProperty('tiDiscordWebhook')) {
        discord {
            webhookUrl = project.tiDiscordWebhook
            dryRunWebhookUrl = project.discordDryrunWebhook
            username = "wendall911"
            content = changelog.map {
                "# A new version of Tinkers' Integrations and Tweaks for Forge ${minecraft_version} has been released! \n" + it
            }
        }
    }

}
