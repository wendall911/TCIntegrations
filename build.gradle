def commonManifest = {
    attributes 'FMLAT': 'tcintegrations_at.cfg'
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_name,
            "Specification-Vendor": "${mod_author}",
            "Specification-Version": "${archiveVersion}",
            "Implementation-Title": "${mod_name}",
            "Implementation-Version": "${archiveVersion}",
            "Implementation-Vendor" :"${mod_author}",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
    'version': actualVersion,
    'minecraft_version': minecraft_version,
    'forge_mc_version_range': forge_mc_version_range,
    'forge_version_range': forge_version_range,
    'malum_minimum_version': malum_minimum_version,
    'create_min_version': create_min_version,
    'tic_version_range': tic_version_range,
    'license': license,
    'mod_id': mod_id,
    'mod_author': mod_author,
    'mod_description': mod_description,
    'mod_display_name': mod_display_name,
    'mod_name': mod_name,
    'mod_credits': mod_credits,
    'mod_update_branch': mod_update_branch,
    'pack_format': pack_format,
    'curseforge_slug': curseforge_slug
]

processResources {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    inputs.properties replaceProperties
    replaceProperties.put 'project', project
    exclude '.cache'

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar.finalizedBy('reobfJar')

task changelog(type: se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask) {
    file.set(new File(project(":").projectDir.toString() + '/build/libs/changelog.txt'));
    templateContent.set(file(project(":").projectDir.toString() + '/files/templates/changelog.mustache').getText('UTF-8'));
    toRevision.set('HEAD');
    fromRevision.set("${minecraft_version}-${last_mod_version}");
}

def updates = tasks.register("generateUpdates", Copy) {
    it.outputs.upToDateWhen {
        false
    }

    it.from("./files/templates/") {
        include 'updates.json'
        expand replaceProperties
    }

    it.into 'files/'
}

tasks.build.dependsOn('changelog', 'generateUpdates')

def changelogFile = project(":").projectDir.toString() + '/build/libs/changelog.txt'
def publishFile = project(":").projectDir.toString() + "/build/libs/${archivesBaseName}-${version}.jar"

publishMods {
    file = file(publishFile)
    if (file(changelogFile).exists()) {
        changelog = file(changelogFile).text
    }
    type = "${release_type}".startsWith("release") ? STABLE : ("${release_type}".startsWith("beta") ? BETA : ALPHA)
    modLoaders.addAll(['neoforge', 'forge'])
    dryRun = providers.environmentVariable('DO_RELEASE').getOrNull() == null

    if (project.hasProperty("${curseforge_api_key_prop}")) {
        curseforge {
            accessToken = project.property("${curseforge_api_key_prop}")
            projectId = "${curseforge_id}"
            projectSlug = "${curseforge_slug}"
            javaVersions.add(JavaVersion.toVersion("${java_version}"))
            clientRequired = true
            serverRequired = true
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('mantle')
            requires('tinkers-construct')
            optional('actually-harvest')
            optional('betterdays')
            optional('charged-charms')
            optional('creeper-fireworks')
            optional('homeostatic')
            optional('magical-psi-revival')
            optional('simpletextoverlay')
            optional('tinkersurvival')
            optional('ready-player-fun')
            optional('configured')
            optional('catalogue')
            optional('immersive-engineering')
            optional('botania')
            optional('create')
            optional('ars-nouveau')
            optional('aquaculture')
            optional('alexs-mobs')
            optional('malum')
            optional('the-undergarden')
            optional('projecte')
            optional('beyond-earth')
            optional('mekanism')
            optional('mythicbotany')
            optional('ice-and-fire-dragons')
            optional('consecration')
            optional('ad-astra')
            optional('apotheosis')
            optional('ars-elemental')
            optional('the-twilight-forest')
            optional('deeperdarker')
        }
    }
    if (project.hasProperty("${modrinth_api_key_prop}")) {
        modrinth {
            accessToken = project.property("${modrinth_api_key_prop}")
            projectId = "${modrinth_id}"
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('mantle')
            requires('tinkers-construct')
            optional('actually-harvest')
            optional('betterdays')
            optional('charged-charms')
            optional('creeper-fireworks-mod')
            optional('homeostatic')
            optional('magical-psi-revival')
            optional('simpletextoverlay')
            optional('tinkersurvival')
            optional('ready-player-fun')
            optional('immersiveengineering')
            optional('botania')
            optional('create')
            optional('ars-nouveau')
            optional('aquaculture')
            optional('alexs-mobs')
            optional('the-undergarden')
            optional('beyond-earth')
            optional('biomesyougo')
            optional('mekanism')
            optional('mythicbotany')
            optional('ice-and-fire-dragons')
            optional('consecration')
            optional('ad-astra')
            optional('deeperdarker')
        }
    }
    if (project.hasProperty("${discord_webhook_prop}")) {
        discord {
            webhookUrl = project.property("${discord_webhook_prop}")
            dryRunWebhookUrl = project.property("${discord_dryrun_webhook_prop}")
            username = "${mod_author}"
            content = changelog.map {
                "# A new version of ${mod_display_name} for Forge ${minecraft_version} has been released! \n" + it
            }
        }
    }
}
